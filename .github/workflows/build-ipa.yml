
name: Build AniKoto IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iOS app for TrollStore
        run: |
          xcodebuild \
            -project AniKoto.xcodeproj \
            -scheme AniKoto \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/AniKoto.app"
          test -d "$APP_PATH"
          mkdir -p package/Payload
          cp -R "$APP_PATH" package/Payload/AniKoto.app
          cd package
          /usr/bin/zip -qry ../AniKoto.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniKoto-IPA
          path: AniKoto.ipa
          if-no-files-found: error
          retention-days: 14
